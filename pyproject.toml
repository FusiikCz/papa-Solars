[project]
name = "solar-diag"
version = "0.1.0"
description = "Domácí diagnostika Pylontech Force H2 v síti 192.168.99.0/24"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
