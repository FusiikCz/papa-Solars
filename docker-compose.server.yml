# Linux v domácnosti. Host síť je potřeba, aby sběr dosáhl na 192.168.99.0/24.
services:
  diag:
    build: .
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://solar:solar@127.0.0.1:5432/solar
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
    restart: unless-stopped
